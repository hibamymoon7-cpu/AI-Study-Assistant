{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | StudyMaster AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #dceaff,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #cddcff,
                    transparent 35%
                ),
                #edf4ff;
        }

        .login-card {

            width: 100%;
            max-width: 470px;

            padding: 42px 40px;

            background: rgba(241,246,255,0.92);

            border-radius: 32px;

            box-shadow:
                15px 15px 35px rgba(130,150,190,0.25),
                -15px -15px 35px rgba(255,255,255,0.95);

            text-align: center;
        }

        /* LOGO */

        .logo-box {

            width: 135px;
            height: 135px;

            margin: 0 auto 20px;

            border-radius: 30px;

            overflow: hidden;

            box-shadow:
                8px 8px 18px rgba(120,145,190,0.25),
                -8px -8px 18px rgba(255,255,255,0.95);
        }

        .logo-box img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* TITLE */

        h1 {

            color: #111b4d;

            font-size: 32px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #69769a;

            font-size: 13px;

            letter-spacing: 3px;

            margin-bottom: 30px;
        }

        /* MESSAGES */

        .messages {
            margin-bottom: 15px;
        }

        .message {

            background: #ffe4e4;

            color: #c62828;

            padding: 10px;

            border-radius: 12px;

            font-size: 13px;

            margin-bottom: 7px;
        }

        /* INPUT */

        .input-group {

            position: relative;

            margin-bottom: 17px;
        }

        .input-icon {

            position: absolute;

            left: 18px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;
        }

        .input-group input {

            width: 100%;

            height: 60px;

            border: none;

            outline: none;

            border-radius: 19px;

            padding: 0 18px 0 55px;

            font-size: 15px;

            color: #26345f;

            background: #edf4ff;

            box-shadow:
                inset 4px 4px 10px rgba(140,160,200,0.20),
                inset -4px -4px 10px rgba(255,255,255,0.95);
        }

        .input-group input::placeholder {
            color: #7c89aa;
        }

        .input-group input:focus {

            box-shadow:
                inset 3px 3px 8px rgba(140,160,200,0.20),
                0 0 0 2px rgba(30,100,230,0.15);
        }

        /* OPTIONS */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 5px 5px 22px;

            font-size: 13px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #566589;
        }

        .remember input {

            width: 17px;
            height: 17px;

            accent-color: #1767e8;
        }

        .forgot {

            color: #145ddd;

            text-decoration: none;

            font-weight: bold;
        }

        /* LOGIN BUTTON */

        .login-btn {

            width: 100%;

            height: 59px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            color: white;

            font-size: 18px;

            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    #1684ff,
                    #164de0
                );

            box-shadow:
                0 10px 25px rgba(35,100,230,0.35);

            transition: 0.3s;
        }

        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(35,100,230,0.40);
        }

        /* REGISTER */

        .register-text {

            margin-top: 25px;

            color: #68769a;

            font-size: 14px;
        }

        .register-text a {

            color: #125edc;

            font-weight: bold;

            text-decoration: none;
        }

        .register-text a:hover {

            text-decoration: underline;
        }

        /* MOBILE */

        @media(max-width: 550px) {

            body {
                padding: 15px;
            }

            .login-card {

                padding: 35px 20px;

                border-radius: 26px;
            }

            .logo-box {

                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 27px;
            }
        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- LOGO -->

    <div class="logo-box">

        <img
            src="{% static 'css/study-logo.jpeg' %}"
            alt="StudyMaster AI"
        >

    </div>


    <!-- TITLE -->

    <h1>
        Welcome Back
    </h1>

    <div class="subtitle">
        SIGN IN TO CONTINUE
    </div>


    <!-- DJANGO MESSAGES -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form method="POST">

        {% csrf_token %}


        <!-- EMAIL -->

        <div class="input-group">

            <span class="input-icon">👤</span>

            <input
                type="email"
                name="email"
                placeholder="Username or Email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <span class="input-icon">🔒</span>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

        </div>


        <!-- OPTIONS -->

        <div class="options">

            <label class="remember">

                <input
                    type="checkbox"
                    name="remember"
                >

                Remember Me

            </label>


            <a href="#" class="forgot">
                Forgot Password?
            </a>

        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >
            Login →
        </button>


    </form>


    <!-- REGISTER -->

    <div class="register-text">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>


</div>


</body>

</html>
