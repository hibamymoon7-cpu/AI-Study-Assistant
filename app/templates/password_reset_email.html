<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StudyMaster AI - Password Reset</title>
</head>

<body style="
    margin: 0;
    padding: 40px 20px;
    background-color: #f4f7fb;
    font-family: Arial, sans-serif;
">

    <div style="
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    ">

        <h1 style="color: #2563eb;">
            StudyMaster AI
        </h1>

        <h2>
            Password Reset
        </h2>

        <p style="font-size: 16px; color: #555;">
            നിങ്ങളുടെ StudyMaster AI account-ന്റെ password reset ചെയ്യാൻ
            request ലഭിച്ചിട്ടുണ്ട്.
        </p>

        <p style="font-size: 16px; color: #555;">
            താഴെയുള്ള button click ചെയ്ത് പുതിയ password set ചെയ്യാം.
        </p>

        <p style="margin: 30px 0;">
            <a
                href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                style="
                    display: inline-block;
                    padding: 14px 28px;
                    background-color: #2563eb;
                    color: white;
                    text-decoration: none;
                    border-radius: 8px;
                    font-weight: bold;
                "
            >
                Reset My Password
            </a>
        </p>

        <p style="font-size: 14px; color: #777;">
            നിങ്ങൾ ഈ request ചെയ്തിട്ടില്ലെങ്കിൽ ഈ email ignore ചെയ്യാം.
        </p>

        <p style="font-size: 13px; color: #999; margin-top: 30px;">
            © StudyMaster AI
        </p>

    </div>

</body>
</html>
