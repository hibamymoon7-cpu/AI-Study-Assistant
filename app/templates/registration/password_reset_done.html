{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Email Sent | StudyMaster AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #dceaff,
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    #cddcff,
                    transparent 35%
                ),

                #edf4ff;
        }

        .reset-card {

            width: 100%;
            max-width: 470px;

            padding: 42px 40px;

            background: rgba(241, 246, 255, 0.95);

            border-radius: 32px;

            box-shadow:
                15px 15px 35px rgba(130, 150, 190, 0.25),
                -15px -15px 35px rgba(255, 255, 255, 0.95);

            text-align: center;
        }

        .logo-box {

            width: 135px;
            height: 135px;

            margin: 0 auto 20px;

            border-radius: 30px;

            overflow: hidden;

            background: white;

            box-shadow:
                8px 8px 18px rgba(120, 145, 190, 0.25),
                -8px -8px 18px rgba(255, 255, 255, 0.95);
        }

        .logo-box img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        h1 {

            color: #111b4d;

            font-size: 30px;

            margin-bottom: 15px;
        }

        p {

            color: #69769a;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 25px;
        }

        .back-login {

            display: inline-block;

            padding: 15px 30px;

            border-radius: 18px;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    #1684ff,
                    #164de0
                );

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            box-shadow:
                0 10px 25px rgba(35, 100, 230, 0.35);
        }

        .back-login:hover {

            transform: translateY(-2px);
        }

        @media (max-width: 550px) {

            body {
                padding: 15px;
            }

            .reset-card {
                padding: 35px 20px;
                border-radius: 26px;
            }

            .logo-box {
                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 27px;
            }
        }

    </style>

</head>

<body>

    <div class="reset-card">

        <div class="logo-box">

            <img
                src="{% static 'css/study-logo.jpeg' %}"
                alt="StudyMaster AI Logo"
            >

        </div>

        <h1>
            Check Your Email
        </h1>

        <p>
            We have sent a password reset link to your email address.

Please check your email and open the link.

        </p>

        <a
            href="{% url 'login' %}"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>

</body>

</html>
