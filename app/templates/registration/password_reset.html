<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AI Study Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #142b44;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #168bf5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0875d1;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #168bf5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email.

You will receive a password reset link via email.
    </p>

    <form method="POST">

        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a href="{% url 'login' %}" class="back">
        ← Back to Login
    </a>

</div>

</body>
</html>
