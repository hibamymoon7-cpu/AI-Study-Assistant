{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | StudyMaster AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #dceaff,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #cddcff,
                    transparent 35%
                ),
                #edf4ff;
        }

        .register-card {

            width: 100%;
            max-width: 470px;

            padding: 35px 40px;

            background: rgba(241, 246, 255, 0.92);

            border-radius: 32px;

            box-shadow:
                15px 15px 35px rgba(130, 150, 190, 0.25),
                -15px -15px 35px rgba(255, 255, 255, 0.95);

            text-align: center;
        }

        .logo-box {

            width: 125px;
            height: 125px;

            margin: 0 auto 18px;

            border-radius: 28px;

            overflow: hidden;

            box-shadow:
                8px 8px 18px rgba(120, 145, 190, 0.25),
                -8px -8px 18px rgba(255,255,255,0.95);
        }

        .logo-box img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        h1 {

            color: #111b4d;

            font-size: 30px;

            margin-bottom: 7px;
        }

        .subtitle {

            color: #69769a;

            font-size: 13px;

            letter-spacing: 3px;

            margin-bottom: 25px;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {

            background: #ffe4e4;

            color: #c62828;

            padding: 10px;

            border-radius: 12px;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .input-group {

            position: relative;

            margin-bottom: 15px;
        }

        .input-icon {

            position: absolute;

            left: 18px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;
        }

        .input-group input {

            width: 100%;

            height: 56px;

            border: none;

            outline: none;

            border-radius: 18px;

            padding: 0 18px 0 55px;

            font-size: 15px;

            color: #26345f;

            background: #edf4ff;

            box-shadow:
                inset 4px 4px 10px rgba(140,160,200,0.20),
                inset -4px -4px 10px rgba(255,255,255,0.95);
        }

        .input-group input::placeholder {
            color: #7c89aa;
        }

        .input-group input:focus {

            box-shadow:
                inset 3px 3px 8px rgba(140,160,200,0.20),
                0 0 0 2px rgba(30,100,230,0.15);
        }

        .register-btn {

            width: 100%;

            height: 57px;

            margin-top: 7px;

            border: none;

            border-radius: 20px;

            cursor: pointer;

            color: white;

            font-size: 18px;

            font-weight: bold;

            background:
                linear-gradient(
                    90deg,
                    #1684ff,
                    #164de0
                );

            box-shadow:
                0 10px 25px rgba(35,100,230,0.35);

            transition: 0.3s;
        }

        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(35,100,230,0.40);
        }

        .login-text {

            margin-top: 24px;

            color: #68769a;

            font-size: 14px;
        }

        .login-text a {

            color: #125edc;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {

            text-decoration: underline;
        }

        @media(max-width: 550px) {

            body {
                padding: 15px;
            }

            .register-card {

                padding: 30px 20px;

                border-radius: 26px;
            }

            .logo-box {

                width: 105px;
                height: 105px;
            }

            h1 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>


<div class="register-card">


    <!-- LOGO -->

    <div class="logo-box">

        <img
            src="{% static 'css/study-logo.jpeg' %}"
            alt="StudyMaster AI"
        >

    </div>


    <!-- TITLE -->

    <h1>
        Create Account
    </h1>

    <div class="subtitle">
        JOIN STUDYMASTER AI
    </div>


    <!-- DJANGO MESSAGES -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}


        <!-- NAME -->

        <div class="input-group">

            <span class="input-icon">👤</span>

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <span class="input-icon">📧</span>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <span class="input-icon">🔒</span>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <span class="input-icon">🔐</span>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="register-btn"
        >
            Create Account →
        </button>


    </form>


    <!-- LOGIN -->

    <div class="login-text">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </div>


</div>


</body>

</html>
